[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tailshare"
version = "1.0.0"
description = "A file-sharing utility for Tailscale networks with TUI interface"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Tailshare Contributors"}
]
keywords = ["tailscale", "file-sharing", "sftp", "tui", "ssh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Networking",
]
dependencies = [
    "textual>=0.40.0",
    "paramiko>=3.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
tailshare = "tailshare.__main__:main"

[project.urls]
Homepage = "https://github.com/tailshare/tailshare"
Documentation = "https://github.com/tailshare/tailshare#readme"
Repository = "https://github.com/tailshare/tailshare"

[tool.setuptools]
packages = ["tailshare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["tailshare"]
omit = ["tests/*"]
