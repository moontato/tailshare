[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tailshare"
dynamic = ["version"]
description = "A file-sharing utility for Tailscale networks with TUI interface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Tailshare Contributors"}
]
keywords = ["tailscale", "file-sharing", "sftp", "tui", "ssh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Networking",
]
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
    "paramiko>=3.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
tailshare = "tailshare.__main__:main"

[project.urls]
Homepage = "https://github.com/tailshare/tailshare"
Documentation = "https://github.com/tailshare/tailshare#readme"
Repository = "https://github.com/tailshare/tailshare"

[tool.setuptools]
packages = ["tailshare"]

[tool.setuptools.dynamic]
version = {attr = "tailshare.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["tailshare"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific rules
]
ignore = [
    "RUF012",  # mutable class-level defaults: Textual BINDINGS idiom
]
